name: Build unsigned IPA

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned, no signing)
        run: |
          set -euxo pipefail
          xcodebuild build \
            -project PlaneGuessr.xcodeproj \
            -scheme PlaneGuessr \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build/dd -quiet

      - name: Package IPA
        run: |
          set -euxo pipefail
          APP="build/dd/Build/Products/Release-iphoneos/PlaneGuessr.app"
          test -d "$APP" || { echo "PlaneGuessr.app not found - build failed"; exit 1; }
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -qry PlaneGuessr.ipa Payload && cd ..
          ls -la build/PlaneGuessr.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PlaneGuessr-unsigned-ipa
          path: build/PlaneGuessr.ipa
          retention-days: 30

      - name: Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/PlaneGuessr.ipa
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
